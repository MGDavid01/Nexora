<!DOCTYPE html>
<html lang="es-MX" data-tema="claro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexora — Prototipo Usuarios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root,
      [data-tema="claro"] {
        --onyx: #0a0a0a;
        --white: #fbfbfb;
        --cerulean: #3573a4;
        --pollen: #ffd342;
        --blue-grey: #6795ba;
        --mustard: #ffd753;
        --powder: #98b7d0;
        --texto: #1c2a33;
        --texto-suave: #4a6270;
        --fondo: #e8eef3;
        --superficie: #fbfbfb;
        --superficie-suave: #e4edf4;
        --borde: #b7c9d6;
        --borde-suave: #d5e1ea;
        --link: #3573a4;
        --ok: #04844b;
        --ok-fondo: #e4f7ed;
        --alerta: #b45309;
        --alerta-fondo: #fff4cc;
        --critico: #c23934;
        --critico-fondo: #fde8e7;
        --sombra: 0 10px 28px rgb(10 10 10 / 10%);
        --tabla-fondo: #fffce8;
        --fila-impar: #fffce8;
        --fila-par: #fff6cc;
        --fila-hover: #ffef99;
        --grid: rgb(53 115 164 / 10%);
        --encabezado: #0a0a0a;
        --barra-fondo: #fbfbfb;
        --barra-borde: #d5e1ea;
        --barra-icono: #3573a4;
        --barra-sombra: 0 16px 40px rgb(10 10 10 / 12%);
        color-scheme: light;
      }

      [data-tema="oscuro"] {
        --onyx: #fbfbfb;
        --white: #0a0a0a;
        --cerulean: #6795ba;
        --pollen: #ffd342;
        --blue-grey: #98b7d0;
        --mustard: #ffd753;
        --powder: #3573a4;
        --texto: #eef4f8;
        --texto-suave: #98b7d0;
        --fondo: #0a0a0a;
        --superficie: #141c22;
        --superficie-suave: #1b2730;
        --borde: #2c3d48;
        --borde-suave: #24323b;
        --link: #ffd342;
        --ok: #86efac;
        --ok-fondo: #14532d;
        --alerta: #ffd753;
        --alerta-fondo: #3a320f;
        --critico: #fb7185;
        --critico-fondo: #3f1520;
        --sombra: 0 12px 32px rgb(0 0 0 / 45%);
        --tabla-fondo: #141c22;
        --fila-impar: #141c22;
        --fila-par: #0f161b;
        --fila-hover: #2a2610;
        --grid: rgb(255 211 66 / 6%);
        --encabezado: #fbfbfb;
        --barra-fondo: #0a0a0a;
        --barra-borde: rgb(255 211 66 / 28%);
        --barra-icono: #98b7d0;
        --barra-sombra: 0 16px 40px rgb(0 0 0 / 45%);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--texto);
        background-color: var(--fondo);
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 28px 28px;
        line-height: 1.4;
      }

      ::selection {
        background: var(--pollen);
        color: #0a0a0a;
      }

      :focus-visible {
        outline: 2px solid var(--pollen);
        outline-offset: 2px;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .marco-sesion {
        height: 100%;
      }

      .marco-sesion > main {
        height: 100%;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 1.15rem 1.35rem 1.25rem 5.5rem;
      }

      /* —— Barra: mesa de servicio —— */
      .barra-flotante {
        position: fixed;
        z-index: 20;
        left: 0.7rem;
        top: 0.7rem;
        bottom: 0.7rem;
        width: 3.7rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 0.65rem;
        padding: 0.65rem 0.4rem;
        border-radius: 1.25rem;
        background: var(--barra-fondo);
        color: var(--barra-icono);
        border: 1px solid var(--barra-borde);
        box-shadow: var(--barra-sombra);
        overflow: visible;
      }

      .barra-marca {
        display: grid;
        place-items: center;
        width: 2.35rem;
        height: 2.35rem;
        flex-shrink: 0;
        border-radius: 0.5rem;
        background: var(--pollen);
        color: #0a0a0a;
      }

      .barra-marca svg {
        width: 1.15rem;
        height: 1.15rem;
      }

      .barra-nav,
      .barra-cuenta {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.28rem;
        margin: 0;
        padding: 0;
        list-style: none;
        width: 100%;
      }

      .barra-nav {
        flex: 1;
        min-height: 0;
        overflow: visible;
        scrollbar-width: none;
      }

      .barra-nav::-webkit-scrollbar {
        display: none;
      }

      .barra-cuenta {
        flex-shrink: 0;
        position: relative;
        padding-top: 0.45rem;
        border-top: 1px solid var(--barra-borde);
      }

      .barra-flotante a,
      .barra-flotante button {
        display: grid;
        place-items: center;
        width: 2.45rem;
        height: 2.45rem;
        padding: 0;
        border: 0;
        border-radius: 0.55rem;
        background: transparent;
        color: var(--barra-icono);
        text-decoration: none;
      }

      .barra-flotante a:hover,
      .barra-flotante button:hover {
        background: rgb(255 211 66 / 28%);
        color: #0a0a0a;
      }

      .barra-flotante a[aria-current="page"] {
        background: var(--pollen);
        color: #0a0a0a;
        box-shadow: 0 4px 10px rgb(255 211 66 / 35%);
      }

      .barra-flotante svg {
        width: 1.22rem;
        height: 1.22rem;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .barra-flotante button.barra-avatar {
        width: 2.2rem;
        height: 2.2rem;
        margin-top: 0.2rem;
        border-radius: 0.45rem;
        background: var(--pollen);
        color: #0a0a0a;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.68rem;
        font-weight: 600;
      }

      .menu-cuenta {
        position: absolute;
        z-index: 30;
        left: calc(100% + 0.75rem);
        bottom: 0;
        width: 15.5rem;
        display: none;
        gap: 0.55rem;
        padding: 0.9rem;
        border: 1px solid var(--borde);
        border-radius: 14px;
        background: var(--superficie);
        color: var(--texto);
        box-shadow: var(--sombra);
      }

      .menu-cuenta.abierto {
        display: grid;
      }

      .menu-nombre {
        margin: 0;
        font-weight: 700;
      }

      .menu-correo {
        margin: 0;
        color: var(--texto-suave);
        font-size: 0.85rem;
      }

      .barra-flotante .menu-cuenta button {
        width: 100%;
        height: auto;
        padding: 0.65rem 0.8rem;
        border: 1px solid var(--borde);
        border-radius: 999px;
        background: transparent;
        color: var(--texto);
        font-weight: 700;
      }

      @media (max-width: 640px) {
        .barra-flotante {
          left: 0.4rem;
          top: 0.4rem;
          bottom: 0.4rem;
          width: 3.2rem;
        }

        .marco-sesion > main {
          height: 100%;
          padding: 1rem 0.9rem 1.5rem 4.15rem;
        }
      }

      /* —— Mesa de servicio (layout igual; carácter de soporte) —— */
      .crm {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        height: 100%;
      }

      .crm-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 0.7rem;
        flex-shrink: 0;
      }

      .crm-titulo {
        display: flex;
        align-items: center;
      }

      .crm-top h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.15;
        color: var(--encabezado);
      }

      .crm-acciones {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.45rem;
        position: relative;
      }

      .btn {
        border: 1px solid var(--borde);
        border-radius: 6px;
        background: var(--superficie);
        color: var(--texto);
        padding: 0.45rem 0.9rem;
        font-size: 0.84rem;
        font-weight: 600;
      }

      .btn:hover {
        background: var(--superficie-suave);
      }

      .btn-principal {
        border-color: transparent;
        background: var(--pollen);
        color: #0a0a0a;
      }

      .btn-principal:hover {
        background: var(--mustard);
      }

      .btn:focus-visible,
      .filtro-dd:focus-visible,
      .crm-buscar input:focus-visible,
      .fila-cuenta:focus-visible {
        outline: 2px solid var(--pollen);
        outline-offset: 2px;
      }

      .menu-alta {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        z-index: 8;
        display: none;
        min-width: 14rem;
        padding: 0.35rem 0;
        border: 1px solid var(--borde);
        border-radius: 6px;
        background: var(--superficie);
        box-shadow: 0 8px 24px rgb(10 10 10 / 12%);
      }

      .menu-alta.abierto {
        display: grid;
      }

      .menu-alta button {
        border: 0;
        background: transparent;
        text-align: left;
        padding: 0.55rem 0.9rem;
        color: var(--texto);
      }

      .menu-alta button:hover {
        background: var(--superficie-suave);
      }

      .crm-filtros {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        align-items: center;
        padding: 0.15rem 0 0.65rem;
        flex-shrink: 0;
      }

      .dd-filtro {
        position: relative;
      }

      .filtro-dd {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        height: 2.25rem;
        border: 1px solid var(--borde);
        background: var(--superficie);
        border-radius: 6px;
        padding: 0 0.75rem;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--texto);
        box-shadow: 0 1px 0 rgb(255 255 255 / 40%) inset;
      }

      .filtro-dd::after {
        content: "";
        width: 0.4rem;
        height: 0.4rem;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(45deg);
        margin-top: -0.2rem;
      }

      .filtro-dd[aria-expanded="true"],
      .filtro-dd.activo {
        border-color: #0a0a0a;
        color: #0a0a0a;
        background: var(--pollen);
      }

      [data-tema="oscuro"] .filtro-dd[aria-expanded="true"],
      [data-tema="oscuro"] .filtro-dd.activo {
        border-color: var(--pollen);
        color: #0a0a0a;
        background: var(--pollen);
      }

      .dd-panel {
        position: absolute;
        z-index: 12;
        top: calc(100% + 4px);
        left: 0;
        display: none;
        min-width: 14.5rem;
        padding: 0.4rem 0;
        border: 1px solid var(--borde);
        border-radius: 6px;
        background: var(--superficie);
        box-shadow: 0 8px 24px rgb(10 10 10 / 12%);
      }

      .dd-filtro.abierto .dd-panel {
        display: grid;
      }

      .dd-panel label {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.45rem 0.8rem;
        font-size: 0.84rem;
        font-weight: 600;
        cursor: pointer;
      }

      .dd-panel label:hover {
        background: var(--superficie-suave);
      }

      .dd-panel input {
        width: 0.95rem;
        height: 0.95rem;
        accent-color: var(--pollen);
      }

      .crm-buscar {
        flex: 1;
        min-width: 12rem;
        display: flex;
        align-items: center;
        gap: 0.45rem;
        height: 2.25rem;
        border: 1px solid var(--borde);
        border-radius: 6px;
        background: var(--superficie);
        padding: 0 0.7rem;
      }

      .crm-buscar svg {
        width: 1rem;
        height: 1rem;
        stroke: var(--texto-suave);
        fill: none;
        stroke-width: 2;
      }

      .crm-buscar input {
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
        color: var(--texto);
        padding: 0;
      }

      .crm-buscar input:focus {
        outline: 0;
      }

      .btn-columnas {
        display: grid;
        place-items: center;
        width: 2.25rem;
        height: 2.25rem;
        padding: 0;
        flex-shrink: 0;
      }

      .btn-columnas svg {
        width: 1.05rem;
        height: 1.05rem;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .modal-fondo {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: rgb(10 10 10 / 45%);
      }

      .modal-fondo[hidden] {
        display: none !important;
      }

      .modal-caja {
        width: min(22rem, 100%);
        background: var(--superficie);
        color: var(--texto);
        border: 1px solid var(--borde);
        border-radius: 8px;
        box-shadow: 0 16px 40px rgb(10 10 10 / 22%);
        padding: 1rem 1.1rem 1.05rem;
      }

      .modal-caja h2 {
        margin: 0 0 0.25rem;
        font-size: 1.05rem;
      }

      .modal-caja .meta {
        margin-bottom: 0.75rem;
      }

      .modal-lista {
        display: grid;
        gap: 0.15rem;
        margin-bottom: 0.9rem;
      }

      .modal-lista label {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.4rem 0.35rem;
        font-size: 0.86rem;
        font-weight: 600;
        cursor: pointer;
        border-radius: 4px;
      }

      .modal-lista label:hover {
        background: var(--superficie-suave);
      }

      .modal-lista input {
        width: 0.95rem;
        height: 0.95rem;
        accent-color: var(--pollen);
      }

      .modal-lista label.fija {
        color: var(--texto-suave);
        cursor: default;
      }

      .modal-acciones {
        display: flex;
        justify-content: flex-end;
        gap: 0.45rem;
      }

      .tablero-crm {
        flex: 1;
        min-height: 0;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr);
        gap: 0.7rem;
        align-items: stretch;
      }

      .tablero-crm.con-detalle {
        grid-template-columns: minmax(14rem, 18rem) minmax(0, 1fr);
      }

      .tablero-crm.con-detalle.sin-lista {
        grid-template-columns: 1fr;
      }

      .tablero-crm.con-detalle.sin-lista .lista-compacta {
        display: none !important;
      }

      .panel {
        background: var(--superficie);
        border: 1px solid var(--borde);
        border-radius: 12px;
        box-shadow: var(--sombra);
        min-height: 0;
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .panel[hidden],
      [hidden] {
        display: none !important;
      }

      .tabla-completa {
        min-height: 0;
        background: var(--tabla-fondo);
      }

      .tabla-wrap {
        flex: 1;
        min-height: 0;
        overflow: auto;
        background: var(--tabla-fondo);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 1;
        text-align: left;
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fbfbfb;
        font-weight: 600;
        padding: 0.72rem 0.8rem;
        border-bottom: 3px solid var(--pollen);
        background: #0a0a0a;
        white-space: nowrap;
      }

      td {
        padding: 0.62rem 0.8rem;
        border-bottom: 1px solid var(--borde-suave);
        font-size: 0.86rem;
        vertical-align: middle;
      }

      td.dato {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.8rem;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      tbody tr:nth-child(odd) td {
        background: var(--fila-impar);
      }

      tbody tr:nth-child(even) td {
        background: var(--fila-par);
      }

      .fila-cuenta {
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--link);
        font-weight: 700;
        padding: 0;
        text-align: left;
      }

      tbody tr:hover td {
        background: var(--fila-hover);
      }

      tr.activa td {
        background: var(--fila-hover);
      }

      .identidad {
        display: flex;
        align-items: center;
        gap: 0.55rem;
      }

      .avatar {
        width: 1.85rem;
        height: 1.85rem;
        border-radius: 0.4rem;
        display: grid;
        place-items: center;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.64rem;
        font-weight: 600;
        color: #0a0a0a;
        background: var(--powder);
        flex-shrink: 0;
      }

      .avatar.plataforma {
        background: var(--pollen);
      }

      .avatar.proveedor {
        background: var(--blue-grey);
        color: #0a0a0a;
      }

      .avatar.cliente {
        background: var(--powder);
      }

      .chip-forma,
      .chip-rol {
        display: inline-flex;
        align-items: center;
        border-radius: 4px;
        padding: 0.12rem 0.45rem;
        font-size: 0.72rem;
        font-weight: 600;
        background: var(--superficie-suave);
        color: var(--texto);
      }

      .chip-forma.empresa {
        background: var(--cerulean);
        color: #fbfbfb;
      }

      .chip-forma.persona {
        background: #0a0a0a;
        color: var(--pollen);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        border-radius: 4px;
        padding: 0.14rem 0.5rem 0.14rem 0.4rem;
        font-size: 0.72rem;
        font-weight: 700;
        background: var(--superficie-suave);
      }

      .pill::before {
        content: "";
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 999px;
        background: currentColor;
        box-shadow: 0 0 0 3px rgb(255 255 255 / 35%);
      }

      .pill.ok {
        background: var(--ok-fondo);
        color: var(--ok);
      }

      .pill.alerta {
        background: var(--alerta-fondo);
        color: var(--alerta);
      }

      .pill.critico {
        background: var(--critico-fondo);
        color: var(--critico);
      }

      .crm-pie {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        padding: 0.55rem 0.85rem;
        color: var(--texto-suave);
        font-size: 0.78rem;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        flex-shrink: 0;
        border-top: 1px solid var(--borde-suave);
        background: var(--fila-par);
      }

      .tabla-wrap::-webkit-scrollbar,
      .lista-compacta::-webkit-scrollbar,
      .ficha-scroll::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      .tabla-wrap::-webkit-scrollbar-thumb,
      .lista-compacta::-webkit-scrollbar-thumb,
      .ficha-scroll::-webkit-scrollbar-thumb {
        background: var(--blue-grey);
        border-radius: 99px;
        border: 2px solid var(--superficie);
      }

      .lista-compacta {
        display: none;
        overflow: auto;
      }

      .tablero-crm.con-detalle .lista-compacta {
        display: flex;
      }

      .tablero-crm.con-detalle .tabla-completa {
        display: none !important;
      }

      .item-compacto {
        width: 100%;
        display: grid;
        gap: 0.1rem;
        border: 0;
        border-bottom: 1px solid var(--borde-suave);
        background: transparent;
        text-align: left;
        padding: 0.7rem 0.8rem;
        color: inherit;
      }

      .item-compacto strong {
        color: var(--link);
        font-size: 0.86rem;
      }

      .item-compacto span {
        color: var(--texto-suave);
        font-size: 0.75rem;
      }

      .item-compacto.activo {
        background: rgb(255 211 66 / 22%);
      }

      [data-tema="oscuro"] .item-compacto.activo {
        background: rgb(255 211 66 / 14%);
      }

      .ficha,
      .marcas {
        padding: 0;
        overflow: hidden;
        min-height: 0;
      }

      .ficha-scroll {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 1.05rem 1.15rem 1.2rem;
        box-shadow: inset 0 3px 0 var(--pollen);
      }

      .ficha-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        margin-bottom: 0.85rem;
      }

      .ficha-top h2 {
        margin: 0 0 0.15rem;
        font-size: 1.15rem;
      }

      .volver {
        border: 0;
        background: transparent;
        color: var(--link);
        font-weight: 700;
        padding: 0;
        margin: 0;
        flex-shrink: 0;
        white-space: nowrap;
      }

      .ficha h2,
      .marcas h2 {
        margin: 0 0 0.15rem;
        font-size: 1.15rem;
      }

      .casillas-marcas {
        display: flex;
        gap: 0.4rem;
        margin: 0.35rem 0 0.55rem;
      }

      .casilla {
        width: 1.2rem;
        height: 1.2rem;
        border: 2px solid #0a0a0a;
        border-radius: 2px;
        background: var(--superficie);
        box-shadow: inset 0 -2px 0 rgb(10 10 10 / 12%);
      }

      [data-tema="oscuro"] .casilla {
        border-color: var(--pollen);
      }

      .casilla.llena {
        border-color: var(--cerulean);
        background: var(--cerulean);
      }

      .casilla.sancion {
        border-color: var(--critico);
        background: var(--critico);
      }

      .meta {
        margin: 0 0 1rem;
        color: var(--texto-suave);
        font-size: 0.85rem;
      }

      .ficha-top .meta {
        margin: 0;
      }

      .props {
        display: grid;
        grid-template-columns: 8.5rem 1fr;
        gap: 0.45rem 0.7rem;
        margin-bottom: 1rem;
        font-size: 0.86rem;
      }

      .props dt {
        color: var(--texto-suave);
        font-weight: 600;
      }

      .props dd {
        margin: 0;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.8rem;
      }

      .campo {
        display: grid;
        gap: 0.25rem;
        margin-bottom: 0.7rem;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .campo input,
      .campo select,
      .campo textarea {
        border: 1px solid var(--borde);
        border-radius: 6px;
        padding: 0.5rem 0.6rem;
        background: var(--superficie);
        color: var(--texto);
        font-weight: 500;
      }

      .aviso,
      .error {
        margin: 0.5rem 0 0;
        padding: 0.55rem 0.65rem;
        border-radius: 4px;
        font-size: 0.82rem;
      }

      .aviso {
        background: var(--ok-fondo);
        color: var(--ok);
      }

      .error {
        background: var(--alerta-fondo);
        color: var(--alerta);
      }

      .marca-item {
        padding: 0.55rem 0.65rem;
        border: 1px solid var(--borde-suave);
        border-radius: 4px;
        margin-bottom: 0.4rem;
      }

      .marca-item strong {
        display: block;
        font-size: 0.78rem;
      }

      .marca-item span {
        color: var(--texto-suave);
        font-size: 0.8rem;
      }

      .alta-panel h2 {
        margin: 0 0 0.35rem;
        font-size: 1.15rem;
      }

      @media (max-width: 720px) {
        .tablero-crm.con-detalle {
          grid-template-columns: 1fr;
        }

        .tablero-crm.con-detalle .lista-compacta {
          display: none;
        }
      }
    </style>

    <script>
      const perfiles = [

        },
        {
          id: "p-pro-1",

          forma: "empresa",
          tipo: "proveedor",
          bloqueado: false,
          baja: false,
          marcas: [{ tipo: "advertencia", causa: "Plazo vencido sin cotizar" }],
          usuarios: [
            { id: "pro-1", nombre: "Luis Proveedor", correo: "proveedor@example.com", telefono: "6642222222", funcion: "administrativo", baja: false },
            { id: "pro-2", nombre: "Marta Ríos", correo: "marta@soportenorte.mx", telefono: "6642222290", funcion: "tecnico", baja: false },
          ],
        },
        {
          id: "p-pro-2",
          nombre: "Redes Baja",
          forma: "empresa",
          tipo: "proveedor",
          bloqueado: true,
          baja: false,
          marcas: [
            { tipo: "advertencia", causa: "No contestó al cliente" },
            { tipo: "sancion", causa: "Segundo vencimiento" },
            { tipo: "sancion", causa: "Reincidencia de plazo" },
          ],
          usuarios: [
            { id: "pro-3", nombre: "Diego Campos", correo: "diego@redesbaja.mx", telefono: "6643331100", funcion: "administrativo", baja: false },
          ],
        },
        {
          id: "p-plat",
          nombre: "Nexora",
          forma: "empresa",
          tipo: "plataforma",
          bloqueado: false,
          baja: false,
          marcas: [],
          usuarios: [
            { id: "admin-1", nombre: "Ana Ruiz", correo: "ana.admin@nexora.mx", telefono: "6640000001", funcion: null, baja: false },
            { id: "admin-2", nombre: "Admin Nexora", correo: "admin@example.com", telefono: "6640000000", funcion: null, baja: false },
          ],
        },
      ];

      const els = {
        cuerpo: document.getElementById("cuerpo"),
        cabeza: document.getElementById("cabeza-tabla"),
        pie: document.getElementById("pie-texto"),
        volverEmpresa: document.getElementById("volver-empresa"),
        buscar: document.getElementById("buscar"),
        tablero: document.getElementById("tablero"),
        compacta: document.getElementById("lista-compacta"),
        ficha: document.getElementById("ficha"),
        fichaNombre: document.getElementById("ficha-nombre"),
        fichaMeta: document.getElementById("ficha-meta"),
        fichaCuerpo: document.getElementById("ficha-cuerpo"),
        marcas: document.getElementById("marcas"),
        marcasCuerpo: document.getElementById("marcas-cuerpo"),
        menuAlta: document.getElementById("menu-alta"),
        btnAlta: document.getElementById("btn-alta"),
      };

      let q = "";
      let perfilActivo = null;
      let seleccion = null;
      let modoAlta = null;
      const filtros = {
        rol: new Set(),
        estado: new Set(),
        forma: new Set(),
        marcas: "",
      };

      const definicionColumnas = [
        { id: "nombre", etiqueta: "Nombre", fija: true },
        { id: "forma", etiqueta: "Forma" },
        { id: "rol", etiqueta: "Rol" },
        { id: "cuentas", etiqueta: "Cuentas" },
        { id: "marcas", etiqueta: "Marcas" },
        { id: "estado", etiqueta: "Estado" },
      ];
      const columnasVisibles = new Set(definicionColumnas.map((c) => c.id));

      function col(id) {
        return columnasVisibles.has(id);
      }

      function thCol(id, texto) {
        return col(id) ? `<th>${texto}</th>` : "";
      }

      function tdCol(id, html, cls) {
        if (!col(id)) return "";
        return `<td${cls ? ` class="${cls}"` : ""}>${html}</td>`;
      }

      function etiquetaTipo(p) {
        if (p.tipo === "cliente") return "Cliente";
        if (p.tipo === "proveedor") return "Proveedor";
        return "Plataforma";
      }

      function rolDe(u, p) {
        if (p.tipo === "plataforma") return "Administrador";
        if (p.tipo === "cliente") return "Cliente";
        return u.funcion === "tecnico" ? "Técnico" : "Administrativo";
      }

      function iniciales(nombre) {
        return nombre
          .split(/\s+/)
          .slice(0, 2)
          .map((p) => p[0])
          .join("")
          .toUpperCase();
      }

      function estadoDe(c) {
        if (c.bloqueado) return { txt: "Bloqueado", cls: "critico" };
        if (c.baja) return { txt: "Baja", cls: "alerta" };
        return { txt: "Activo", cls: "ok" };
      }

      function claveEstado(p) {
        if (p.bloqueado) return "bloqueado";
        if (p.baja) return "baja";
        return "activo";
      }

      function perfilPorId(id) {
        return perfiles.find((p) => p.id === id);
      }

      function usuarioEn(p, id) {
        return p?.usuarios.find((u) => u.id === id);
      }

      function perfilesFiltrados() {
        return perfiles.filter((p) => {
          if (filtros.rol.size && !filtros.rol.has(p.tipo)) return false;
          if (filtros.estado.size && !filtros.estado.has(claveEstado(p))) return false;
          if (filtros.forma.size && !filtros.forma.has(p.forma)) return false;
          const tieneMarcas = p.tipo !== "plataforma" && p.marcas.length > 0;
          if (filtros.marcas === "con" && !tieneMarcas) return false;
          if (filtros.marcas === "sin" && tieneMarcas) return false;
          const correos = p.usuarios.map((u) => u.correo).join(" ");
          return `${p.nombre} ${correos} ${etiquetaTipo(p)} ${p.forma}`.toLowerCase().includes(q);
        });
      }

      function etiquetaFiltro(clave, vacio, etiquetas) {
        const set = filtros[clave];
        const btn = document.querySelector(`[data-filtro="${clave}"] .filtro-dd`);
        if (!btn) return;
        btn.classList.toggle("activo", set.size > 0);
        if (!set.size) {
          btn.textContent = vacio;
          return;
        }
        const nombres = [...set].map((valor) => etiquetas[valor]);
        btn.textContent = nombres.length === 1 ? `${vacio}: ${nombres[0]}` : `${vacio} (${nombres.length})`;
      }

      function pintarEtiquetasFiltro() {
        etiquetaFiltro("rol", "Rol", {
          cliente: "Cliente",
          proveedor: "Proveedor",
          plataforma: "Plataforma",
        });
        etiquetaFiltro("estado", "Estado de cuenta", {
          activo: "Activo",
          bloqueado: "Bloqueado",
          baja: "Baja solicitada",
        });
        etiquetaFiltro("forma", "Forma", {
          persona: "Persona",
          empresa: "Empresa",
        });
        const btnMarcas = document.querySelector('[data-filtro="marcas"] .filtro-dd');
        const etiquetasMarcas = { con: "Con marcas", sin: "Sin marcas" };
        btnMarcas.classList.toggle("activo", Boolean(filtros.marcas));
        btnMarcas.textContent = filtros.marcas ? `Marcas: ${etiquetasMarcas[filtros.marcas]}` : "Marcas";
      }

      function abrirPerfil(id) {
        modoAlta = null;
        const p = perfilPorId(id);
        if (!p) return;
        perfilActivo = id;
        if (p.forma === "persona" && p.usuarios[0]) {
          abrirDetalle(p.usuarios[0].id);
          return;
        }
        seleccion = null;
        mostrarFicha(true);
        render();
      }

      function abrirDetalle(id) {
        modoAlta = null;
        const p = perfilActivo ? perfilPorId(perfilActivo) : perfiles.find((perfil) => usuarioEn(perfil, id));
        if (!p) return;
        perfilActivo = p.id;
        seleccion = id;
        mostrarFicha(p.forma === "empresa");
        render();
      }

      function mostrarFicha(conLista) {
        els.tablero.classList.add("con-detalle");
        els.tablero.classList.toggle("sin-lista", !conLista);
        els.ficha.hidden = false;
        els.marcas.hidden = true;
        if (!conLista) els.compacta.innerHTML = "";
      }

      function cerrarPaneles() {
        els.tablero.classList.remove("con-detalle", "sin-lista");
        els.ficha.hidden = true;
        els.marcas.hidden = true;
        els.fichaCuerpo.innerHTML = "";
        els.compacta.innerHTML = "";
      }

      function render() {
        pintarEtiquetasFiltro();
        const pActivo = perfilPorId(perfilActivo);
        const listandoUsuarios = Boolean(pActivo && pActivo.forma === "empresa" && !seleccion && !modoAlta);

        if (modoAlta) {
          pintarTablaPerfiles();
          pintarListaLateral(perfilesFiltrados(), { id: null });
          pintarAlta(modoAlta);
          return;
        }
        if (seleccion && pActivo) {
          mostrarFicha(pActivo.forma === "empresa");
          if (pActivo.forma === "empresa") pintarListaLateral(usuariosVisibles(pActivo), pActivo);
          pintarDetalle(usuarioEn(pActivo, seleccion), pActivo);
          return;
        }
        if (listandoUsuarios) {
          mostrarFicha(true);
          pintarListaLateral(usuariosVisibles(pActivo), pActivo);
          pintarDetalleEmpresa(pActivo);
          return;
        }
        perfilActivo = null;
        cerrarPaneles();
        pintarTablaPerfiles();
      }

      function pintarTablaPerfiles() {
        const lista = perfilesFiltrados();
        els.volverEmpresa.hidden = true;
        els.pie.textContent = `${lista.length} personas o empresas`;
        els.cabeza.innerHTML =
          thCol("nombre", "Nombre") +
          thCol("forma", "Forma") +
          thCol("rol", "Rol") +
          thCol("cuentas", "Cuentas") +
          thCol("marcas", "Marcas") +
          thCol("estado", "Estado");
        els.cuerpo.innerHTML = lista
          .map((p) => {
            const est = estadoDe(p);
            const marcas = p.tipo === "plataforma" ? "—" : `${p.marcas.length}/3`;
            return `<tr>
              ${tdCol(
                "nombre",
                `<div class="identidad">
                  <span class="avatar ${p.tipo}">${iniciales(p.nombre)}</span>
                  <button type="button" class="fila-cuenta" data-abrir="perfil" data-id="${p.id}">${p.nombre}</button>
                </div>`
              )}
              ${tdCol("forma", `<span class="chip-forma ${p.forma}">${p.forma === "persona" ? "Persona" : "Empresa"}</span>`)}
              ${tdCol("rol", `<span class="chip-rol">${etiquetaTipo(p)}</span>`)}
              ${tdCol("cuentas", p.usuarios.length, "dato")}
              ${tdCol("marcas", marcas, "dato")}
              ${tdCol("estado", `<span class="pill ${est.cls}">${est.txt}</span>`)}
            </tr>`;
          })
          .join("");
        els.compacta.innerHTML = "";
      }

      function usuariosVisibles(p) {
        return p.usuarios.filter((u) =>
          `${u.nombre} ${u.correo} ${u.telefono} ${rolDe(u, p)}`.toLowerCase().includes(q)
        );
      }

      function htmlMarcas(p) {
        if (p.tipo === "plataforma") {
          return `<p class="meta">Un administrador de plataforma no acumula marcas.</p>`;
        }
        return `<div class="casillas-marcas" aria-label="${p.marcas.length} de 3 marcas">
          ${[0, 1, 2]
            .map((i) => {
              const m = p.marcas[i];
              const cls = m ? `casilla llena${m.tipo === "sancion" ? " sancion" : ""}` : "casilla";
              const titulo = m ? `${m.tipo === "advertencia" ? "Advertencia" : "Sanción"}: ${m.causa}` : `Marca ${i + 1} vacía`;
              return `<span class="${cls}" title="${titulo}"></span>`;
            })
            .join("")}
        </div>
        <p class="meta">${p.marcas.length} de 3. Las marcas son del perfil ${p.nombre}. A la tercera se bloquean todos sus usuarios.</p>
        ${
          p.marcas.length
            ? p.marcas
                .map(
                  (m) => `<article class="marca-item"><strong>${m.tipo === "advertencia" ? "Advertencia" : "Sanción"}</strong><span>${m.causa}</span></article>`
                )
                .join("")
            : ""
        }
        <form id="form-marca">
          <label class="campo">Tipo
            <select name="tipo">
              <option value="advertencia">Advertencia</option>
              <option value="sancion">Sanción</option>
            </select>
          </label>
          <label class="campo">Causa <input name="causa" required ${p.bloqueado ? "disabled" : ""} /></label>
          <button class="btn btn-principal" type="submit" ${p.bloqueado ? "disabled" : ""}>${p.bloqueado ? "Perfil bloqueado" : "Registrar marca"}</button>
          <p class="error" id="error-marca" hidden></p>
          <p class="aviso" id="aviso-marca" hidden></p>
        </form>`;
      }

      function enlazarMarca(p) {
        document.getElementById("form-marca")?.addEventListener("submit", (e) => {
          e.preventDefault();
          const f = new FormData(e.currentTarget);
          const causa = String(f.get("causa")).trim();
          const error = document.getElementById("error-marca");
          const aviso = document.getElementById("aviso-marca");
          error.hidden = true;
          if (p.marcas.some((m) => m.causa.toLowerCase() === causa.toLowerCase())) {
            error.hidden = false;
            error.textContent = "Esa causa ya tiene una marca en este perfil.";
            return;
          }
          p.marcas.unshift({ tipo: String(f.get("tipo")), causa });
          if (p.marcas.length >= 3) p.bloqueado = true;
          aviso.hidden = false;
          aviso.textContent = p.bloqueado
            ? "Marca registrada. El perfil quedó bloqueado."
            : "Marca registrada. Se notificará al perfil; no bloquea todavía.";
          render();
        });
      }

      function pintarListaLateral(items, p) {
        const esUsuarios = Array.isArray(items) && items[0] && "correo" in items[0];
        els.compacta.innerHTML = items
          .map((item) => {
            if (esUsuarios) {
              return `<button type="button" class="item-compacto ${item.id === seleccion ? "activo" : ""}" data-abrir="usuario" data-id="${item.id}">
                <strong>${item.nombre}</strong>
                <span>${rolDe(item, p)}</span>
              </button>`;
            }
            return `<button type="button" class="item-compacto ${item.id === p.id ? "activo" : ""}" data-abrir="perfil" data-id="${item.id}">
              <strong>${item.nombre}</strong>
              <span>${item.forma === "persona" ? "Persona" : "Empresa"} · ${etiquetaTipo(item)}</span>
            </button>`;
          })
          .join("");
      }

      function pintarDetalleEmpresa(p) {
        const est = estadoDe(p);
        els.fichaNombre.textContent = p.nombre;
        els.fichaMeta.innerHTML = `Empresa · ${etiquetaTipo(p)} · <span class="pill ${est.cls}">${est.txt}</span>`;
        document.getElementById("volver").textContent = "← Volver al padrón";
        els.fichaCuerpo.innerHTML = `
          <dl class="props">
            <dt>Forma</dt><dd>Empresa</dd>
            <dt>Rol</dt><dd>${etiquetaTipo(p)}</dd>
            <dt>Cuentas</dt><dd>${p.usuarios.length}</dd>
            <dt>Marcas</dt><dd>${p.tipo === "plataforma" ? "—" : `${p.marcas.length}/3`}</dd>
          </dl>
          ${htmlMarcas(p)}
        `;
        enlazarMarca(p);
      }

      function pintarDetalle(u, p) {
        if (!u || !p) return;
        const est = estadoDe(p);
        els.fichaNombre.textContent = u.nombre;
        els.fichaMeta.innerHTML = `${rolDe(u, p)} · ${p.nombre} · <span class="pill ${est.cls}">${est.txt}</span>`;
        const volver = document.getElementById("volver");
        volver.textContent = p.forma === "empresa" ? "← Volver a la empresa" : "← Volver al padrón";
        els.fichaCuerpo.innerHTML = `
          <dl class="props">
            <dt>Correo</dt><dd>${u.correo}</dd>
            <dt>Teléfono</dt><dd>${u.telefono}</dd>
            <dt>Función</dt><dd>${u.funcion ?? "—"}</dd>
            <dt>Marcas</dt><dd>${p.tipo === "plataforma" ? "—" : `${p.marcas.length}/3`}</dd>
          </dl>
          ${htmlMarcas(p)}
          <form id="form-editar">
            <label class="campo">Nombre <input name="nombre" value="${u.nombre}" required /></label>
            <label class="campo">Correo <input name="correo" type="email" value="${u.correo}" required /></label>
            <label class="campo">Teléfono <input name="telefono" value="${u.telefono}" required /></label>
            ${
              p.tipo === "proveedor"
                ? `<label class="campo">Función
                    <select name="funcion">
                      <option value="administrativo" ${u.funcion === "administrativo" ? "selected" : ""}>Administrativo</option>
                      <option value="tecnico" ${u.funcion === "tecnico" ? "selected" : ""}>Técnico</option>
                    </select>
                  </label>`
                : ""
            }
            <button class="btn btn-principal" type="submit">Guardar cuenta</button>
            <p class="aviso" id="aviso-editar" hidden></p>
          </form>
        `;
        document.getElementById("form-editar").addEventListener("submit", (e) => {
          e.preventDefault();
          const f = new FormData(e.currentTarget);
          u.nombre = String(f.get("nombre"));
          u.correo = String(f.get("correo"));
          u.telefono = String(f.get("telefono"));
          if (p.tipo === "proveedor") u.funcion = String(f.get("funcion"));
          const aviso = document.getElementById("aviso-editar");
          aviso.hidden = false;
          aviso.textContent = "Cuenta actualizada (prototipo).";
          render();
        });
        enlazarMarca(p);
      }

      function pintarAlta(tipo) {
        seleccion = null;
        perfilActivo = null;
        els.tablero.classList.add("con-detalle");
        els.ficha.hidden = false;
        els.marcas.hidden = true;
        const titulos = {
          cliente: ["Alta de cliente", "Crea el perfil y la única cuenta de esa persona o empresa."],
          proveedor: ["Alta de proveedor", "Crea el perfil. La primera cuenta queda como administrativa."],
          administrador: ["Alta de administrador", "Cuenta de plataforma, sin perfil cliente ni proveedor."],
        };
        const [titulo, texto] = titulos[tipo];
        els.fichaNombre.textContent = titulo;
        els.fichaMeta.textContent = texto;
        els.fichaCuerpo.innerHTML = `
          <form id="form-alta">
            <label class="campo">Nombre <input name="nombre" required /></label>
            <label class="campo">Correo <input name="correo" type="email" required /></label>
            <label class="campo">Contraseña inicial <input name="contrasena" type="password" minlength="8" required /></label>
            <label class="campo">Teléfono <input name="telefono" required /></label>
            ${
              tipo !== "administrador"
                ? `<label class="campo">Nombre del perfil <input name="perfil" value="${tipo === "proveedor" ? "" : "Persona"}" /></label>`
                : ""
            }
            <button class="btn btn-principal" type="submit">Registrar</button>
          </form>
        `;
        document.getElementById("form-alta").addEventListener("submit", (e) => {
          e.preventDefault();
          const f = new FormData(e.currentTarget);
          const id = "n-" + Date.now();
          const nombre = String(f.get("nombre"));
          const forma = tipo === "cliente" && String(f.get("perfil") || "Persona") === "Persona" ? "persona" : "empresa";
          const perfilTipo = tipo === "administrador" ? "plataforma" : tipo;
          perfiles.push({
            id: "p-" + id,
            nombre: tipo === "administrador" ? "Nexora" : String(f.get("perfil") || nombre),
            forma: tipo === "administrador" ? "empresa" : forma,
            tipo: perfilTipo,
            bloqueado: false,
            baja: false,
            marcas: [],
            usuarios: [
              {
                id,
                nombre,
                correo: String(f.get("correo")),
                telefono: String(f.get("telefono")),
                funcion: tipo === "proveedor" ? "administrativo" : null,
                baja: false,
              },
            ],
          });
          modoAlta = null;
          if (forma === "persona" && tipo === "cliente") abrirDetalle(id);
          else abrirPerfil("p-" + id);
        });
      }

      document.querySelectorAll(".dd-filtro").forEach((dd) => {
        const btn = dd.querySelector(".filtro-dd");
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const abrir = !dd.classList.contains("abierto");
          document.querySelectorAll(".dd-filtro").forEach((otro) => {
            otro.classList.remove("abierto");
            otro.querySelector(".filtro-dd").setAttribute("aria-expanded", "false");
          });
          dd.classList.toggle("abierto", abrir);
          btn.setAttribute("aria-expanded", String(abrir));
        });
        dd.querySelectorAll("input[type=checkbox]").forEach((input) => {
          input.addEventListener("change", () => {
            const set = filtros[input.name];
            if (input.checked) set.add(input.value);
            else set.delete(input.value);
            render();
          });
        });
        dd.querySelectorAll("input[type=radio]").forEach((input) => {
          input.addEventListener("change", () => {
            if (input.name === "marcas") filtros.marcas = input.value;
            render();
          });
        });
      });

      els.buscar.addEventListener("input", () => {
        q = els.buscar.value.trim().toLowerCase();
        render();
      });

      document.addEventListener("click", (e) => {
        const fila = e.target.closest("[data-id]");
        if (!fila || !(fila.classList.contains("fila-cuenta") || fila.classList.contains("item-compacto"))) return;
        if (fila.dataset.abrir === "perfil") abrirPerfil(fila.dataset.id);
        else abrirDetalle(fila.dataset.id);
      });

      document.getElementById("volver").addEventListener("click", () => {
        modoAlta = null;
        const p = perfilPorId(perfilActivo);
        if (seleccion && p && p.forma === "empresa") {
          seleccion = null;
          render();
          return;
        }
        seleccion = null;
        perfilActivo = null;
        cerrarPaneles();
        render();
      });

      document.getElementById("volver-empresa").addEventListener("click", () => {
        perfilActivo = null;
        seleccion = null;
        modoAlta = null;
        cerrarPaneles();
        render();
      });

      els.btnAlta.addEventListener("click", () => {
        const abierto = els.menuAlta.classList.toggle("abierto");
        els.btnAlta.setAttribute("aria-expanded", String(abierto));
      });

      els.menuAlta.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-alta]");
        if (!btn) return;
        modoAlta = btn.dataset.alta;
        els.menuAlta.classList.remove("abierto");
        render();
      });

      function pintarOpcionesColumnas() {
        document.getElementById("lista-columnas").innerHTML = definicionColumnas
          .map(
            (c) => `<label class="${c.fija ? "fija" : ""}">
              <input type="checkbox" name="columna" value="${c.id}" ${col(c.id) ? "checked" : ""} ${c.fija ? "disabled" : ""} />
              ${c.etiqueta}${c.fija ? " (siempre visible)" : ""}
            </label>`
          )
          .join("");
      }

      function abrirModalColumnas() {
        pintarOpcionesColumnas();
        const modal = document.getElementById("modal-columnas");
        modal.hidden = false;
        document.getElementById("btn-columnas-cerrar").focus();
      }

      function cerrarModalColumnas() {
        document.getElementById("modal-columnas").hidden = true;
      }

      document.getElementById("btn-columnas").addEventListener("click", abrirModalColumnas);
      document.getElementById("btn-columnas-cerrar").addEventListener("click", cerrarModalColumnas);
      document.getElementById("modal-columnas").addEventListener("click", (e) => {
        if (e.target.id === "modal-columnas") cerrarModalColumnas();
      });
      document.getElementById("lista-columnas").addEventListener("change", (e) => {
        const input = e.target.closest('input[name="columna"]');
        if (!input || input.disabled) return;
        if (input.checked) columnasVisibles.add(input.value);
        else columnasVisibles.delete(input.value);
        pintarTablaPerfiles();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !document.getElementById("modal-columnas").hidden) {
          cerrarModalColumnas();
        }
      });

      document.getElementById("btn-exportar").addEventListener("click", () => {
        alert("Prototipo: no exporta archivos.");
      });

      document.getElementById("btn-tema").addEventListener("click", () => {
        const root = document.documentElement;
        const actual = root.getAttribute("data-tema") === "oscuro" ? "oscuro" : "claro";
        root.setAttribute("data-tema", actual === "oscuro" ? "claro" : "oscuro");
      });

      const menu = document.getElementById("menu-cuenta");
      const btnAvatar = document.getElementById("btn-avatar");
      btnAvatar.addEventListener("click", () => {
        const abierto = menu.classList.toggle("abierto");
        btnAvatar.setAttribute("aria-expanded", String(abierto));
      });
      document.addEventListener("pointerdown", (e) => {
        if (!document.getElementById("cuenta").contains(e.target)) {
          menu.classList.remove("abierto");
          btnAvatar.setAttribute("aria-expanded", "false");
        }
        if (!e.target.closest(".crm-acciones")) {
          els.menuAlta.classList.remove("abierto");
          els.btnAlta.setAttribute("aria-expanded", "false");
        }
        if (!e.target.closest(".dd-filtro")) {
          document.querySelectorAll(".dd-filtro").forEach((dd) => {
            dd.classList.remove("abierto");
            dd.querySelector(".filtro-dd").setAttribute("aria-expanded", "false");
          });
        }
      });
      document.getElementById("btn-salir").addEventListener("click", () => {
        alert("Prototipo: en la app real esto cierra la sesión.");
      });

      render();
    </script>
  </body>
</html>
